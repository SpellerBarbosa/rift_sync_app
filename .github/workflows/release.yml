name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      # Injeta as chaves de API no .env para que o build.rs as embuta no binário em compile time
      - name: Create .env
        run: |
          "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}`nSPELLCOACH_API_KEY=${{ secrets.SPELLCOACH_API_KEY }}" |
            Out-File -FilePath src-tauri/.env -Encoding utf8NoBOM

      # Converte line endings da chave para LF e injeta no ambiente do runner
      # (GitHub Actions não avalia expressões em valores de env multilinea diretamente)
      - name: Write signing key to env
        run: |
          $key = "${{ secrets.TAURI_PRIVATE_KEY }}"
          $key = $key -replace "`r`n", "`n" -replace "`r", "`n"
          $delimiter = "EOF_TAURI_KEY_$([System.Guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY<<$delimiter"
          Add-Content -Path $env:GITHUB_ENV -Value $key
          Add-Content -Path $env:GITHUB_ENV -Value $delimiter

      - name: Build e publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RiftSync AI ${{ github.ref_name }}'
          releaseBody: |
            ## RiftSync AI ${{ github.ref_name }}

            Baixe o instalador abaixo e execute `RiftSync-AI_*_x64-setup.exe`.

            Usuários com versão anterior: o app atualiza automaticamente.
          releaseDraft: false
          prerelease: false
          updaterJsonEnabled: true
          updaterJsonPreferNsis: true

      - name: Upload instalador com nome fixo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*_x64-setup.exe" | Select-Object -First 1
          gh release upload ${{ github.ref_name }} "$($installer.FullName)#RiftSync-AI-setup.exe" --clobber
