name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      # Injeta as chaves de API no .env para que o build.rs as embuta no binário em compile time
      - name: Create .env
        run: |
          "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}`nSPELLCOACH_API_KEY=${{ secrets.SPELLCOACH_API_KEY }}" |
            Out-File -FilePath src-tauri/.env -Encoding utf8NoBOM

      # Decodifica o base64 para bytes e escreve direto — sem encoding, sem CRLF, sem BOM
      - name: Write signing key
        run: |
          $keyBytes = [System.Convert]::FromBase64String("${{ secrets.TAURI_PRIVATE_KEY }}")
          $keyPath  = "$env:RUNNER_TEMP\tauri.key"
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          Write-Host "Key decoded: $($keyBytes.Length) bytes"
          Write-Host "First line: $([System.Text.Encoding]::UTF8.GetString($keyBytes).Split("`n")[0])"
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Build e publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RiftSync AI ${{ github.ref_name }}'
          releaseBody: |
            ## RiftSync AI ${{ github.ref_name }}

            Baixe o instalador abaixo e execute `RiftSync-AI_*_x64-setup.exe`.

            Usuários com versão anterior: o app atualiza automaticamente.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Gerar e publicar latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle\nsis"
          Write-Host "Bundle dir: $bundleDir"
          Get-ChildItem $bundleDir -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table
          $nsisZip = Get-ChildItem "$bundleDir\*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisSig = Get-ChildItem "$bundleDir\*.nsis.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $nsisZip -or -not $nsisSig) { Write-Error "NSIS zip/sig nao encontrado em $bundleDir"; exit 1 }

          $sigContent = (Get-Content $nsisSig.FullName -Raw).Trim()
          if (-not $sigContent) { Write-Error "Sig file vazio — signing falhou"; exit 1 }

          $version = (Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag     = "${{ github.ref_name }}"

          gh release upload $tag "$($nsisZip.FullName)" --clobber

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$([Uri]::EscapeDataString($nsisZip.Name))"
          $json = [ordered]@{
            version  = $version
            notes    = ""
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5

          $json | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
          gh release upload $tag "latest.json" --clobber
          Write-Host "latest.json publicado com sucesso — versao $version"

      - name: Upload instalador com nome fixo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*_x64-setup.exe" | Select-Object -First 1
          gh release upload ${{ github.ref_name }} "$($installer.FullName)#RiftSync-AI-setup.exe" --clobber
