name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      # Injeta as chaves de API no .env para que o build.rs as embuta no binário em compile time
      - name: Create .env
        run: |
          "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}`nSPELLCOACH_API_KEY=${{ secrets.SPELLCOACH_API_KEY }}" |
            Out-File -FilePath src-tauri/.env -Encoding utf8NoBOM

      # Remove trailing newline que GitHub pode adicionar ao secret
      - name: Set signing key
        run: |
          $key = "${{ secrets.TAURI_PRIVATE_KEY }}".Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: Build e publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RiftSync AI ${{ github.ref_name }}'
          releaseBody: |
            ## RiftSync AI ${{ github.ref_name }}

            Baixe o instalador abaixo e execute `RiftSync-AI_*_x64-setup.exe`.

            Usuários com versão anterior: o app atualiza automaticamente.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # createUpdaterArtifacts ignorado no CLI 2.1.x — criamos e assinamos manualmente
      - name: Criar zip e gerar latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem "$bundleDir\*_x64-setup.exe" | Select-Object -First 1

          # Criar .nsis.zip a partir do instalador
          $zipPath = $exe.FullName -replace "\.exe$", ".nsis.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zipPath -Force
          Write-Host "Zip criado: $(Split-Path $zipPath -Leaf) ($('{0:N0}' -f (Get-Item $zipPath).Length) bytes)"

          # Assinar — senha vazia em env evita prompt interativo; chave como string direta
          $key = "${{ secrets.TAURI_PRIVATE_KEY }}".Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          npx --no-install tauri signer sign -k "$key" "$zipPath"
          $sigPath = "$zipPath.sig"

          if (-not (Test-Path $sigPath)) { Write-Error "Sig nao gerado"; exit 1 }
          $sigContent = (Get-Content $sigPath -Raw).Trim()
          if (-not $sigContent) { Write-Error "Sig vazio"; exit 1 }
          Write-Host "Assinatura gerada ($($sigContent.Length) chars)"

          # Publicar zip na release
          $tag = "${{ github.ref_name }}"
          gh release upload $tag $zipPath --clobber

          # Gerar latest.json
          $version = (Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          $zipName = Split-Path $zipPath -Leaf
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$([Uri]::EscapeDataString($zipName))"

          $json = [ordered]@{
            version  = $version
            notes    = ""
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5

          $json | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
          gh release upload $tag "latest.json" --clobber
          Write-Host "latest.json publicado — versao $version"

      - name: Upload instalador com nome fixo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*_x64-setup.exe" | Select-Object -First 1
          gh release upload ${{ github.ref_name }} "$($installer.FullName)#RiftSync-AI-setup.exe" --clobber
